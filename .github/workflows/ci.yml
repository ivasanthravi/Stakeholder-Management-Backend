# CI/CD: every push and pull request runs the release gate (mirrors app/scripts/release-gate.sh).
# A push to main that passes every check is then deployed to Netlify (see docs/launch/netlify-deploy.md).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
# Block style: a `${{ }}` expression inside a one-line `{ }` mapping is invalid YAML (GitHub rejects the whole file).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults: { run: { working-directory: app } }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Dependency audit (runtime, high/critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx eslint . --max-warnings=50
      - name: Tests (PGlite)
        run: npx vitest run
      - name: Tests (real PostgreSQL via embedded-postgres)
        run: node scripts/test-postgres.mjs
      - name: AI evaluation + safety/grounding gate
        run: |
          AI_ENGINE=local npx tsx evals/run.ts > /dev/null
          npx tsx evals/gate.ts
      - name: Backup/restore drill
        run: npx tsx scripts/restore-drill.ts
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # Playwright uses the runner's installed Google Chrome (channel: 'chrome').
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: app/test-results, retention-days: 7 }
  deploy:
    # Production deploy: only pushes to main, only after verify and e2e pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check deploy secrets
        working-directory: .
        run: |
          missing=""
          for v in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID DATABASE_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          # A copy of the repository without Netlify secrets (a fork, a mirror) skips the deploy instead of failing.
          if [ -n "$missing" ]; then echo "::notice::Deploy skipped. To deploy, add these repository secrets (Settings → Secrets and variables → Actions):$missing"; echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP_DEPLOY != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP_DEPLOY != '1'
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        if: env.SKIP_DEPLOY != '1'
      # Migrations are additive (expand/contract), so the running site keeps working while they apply.
      - name: Apply database migrations
        if: env.SKIP_DEPLOY != '1'
        run: npm run db:migrate
      - name: Build and deploy to Netlify
        if: env.SKIP_DEPLOY != '1'
        working-directory: .
        run: |
          npx -y netlify-cli@27.16.2 build --context production
          npx -y netlify-cli@27.16.2 deploy --no-build --prod --site "$NETLIFY_SITE_ID" --message "${{ github.sha }}" --json > deploy.json
          node -e 'const d=require("./deploy.json");console.log("Live at "+d.url);require("fs").appendFileSync(process.env.GITHUB_ENV,"SITE_URL="+d.url+"\n")'
      - name: Smoke test the live site
        if: env.SKIP_DEPLOY != '1'
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do curl -fsS "$SITE_URL/api/health" && exit 0; sleep 10; done
          echo "::error::$SITE_URL/api/health did not answer"; exit 1
