# Render Blueprint: one free web service built from app/Dockerfile.
# Render → New → Blueprint → pick this repository. Values marked `sync: false` are asked for once in the
# Render dashboard and are never stored in this file. The database is external (Neon); see docs/launch/deployment-runbook.md.
services:
  - type: web
    name: meridian
    runtime: docker
    dockerContext: ./app
    dockerfilePath: ./app/Dockerfile
    plan: free
    region: singapore          # close to the Neon database (ap-southeast-1)
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOY_ENV
        value: production
      - key: AUTH_SECRET          # session signing key, generated by Render
        generateValue: true
      - key: DATABASE_URL         # Neon connection string for the production database
        sync: false
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER            # the Gmail address that sends mail
        sync: false
      - key: SMTP_PASSWORD        # a Google App Password, not the Gmail password
        sync: false
      - key: MAIL_FROM            # e.g. Meridian <you@gmail.com>, same address as SMTP_USER
        sync: false
      - key: SIGNUP_ALLOWLIST     # who may sign up (production is invite-only): emails or @domains, comma-separated
        sync: false
